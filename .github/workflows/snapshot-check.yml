name: Repository snapshots and isolation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_repository.py
      # Add product lint/typecheck/test/build in this repo during bootstrap.
      # Wire --release into release CI only after reviewed integration evidence exists.
